# YT Guru — build the Windows installer (v1.0.0).
#
# PyInstaller on Linux CANNOT build a Windows .exe, so the build
# runs on a free GitHub Actions windows-latest runner and produces
# YT-Guru-Setup-<version>.exe as a build artifact.
#
# Layout (repo amirowaisy72/youtube-cover-video-tool):
#   - this file lives at the repo root: .github/workflows/
#   - the app lives at the repo root: backend/, frontend-react/,
#     requirements.txt (root file: fastapi, uvicorn, yt-dlp...)
#   - the installer bits live in ytguru-commercial/installer/
#     (launcher.py, ytguru.iss, Run-Setup.bat)
#
# Frontend: the interface is the React SPA in frontend-react/
# (Lovable design, ported to the real backend). It is built here
# with Bun — npm install fails on this dependency tree with npm's
# arborist bug ("Cannot read properties of null (reading
# 'edgesOut')"), so Bun is the installer for this step.
# The built output (frontend-react/dist) is bundled by PyInstaller
# as "frontend", which backend/main.py serves (with the old
# vanilla frontend/ as a fallback when no build exists).
#
# The workflow smoke-tests the frozen exe for real: it starts
# dist\YT-Guru\YT-Guru.exe and waits for /api/health — the build
# FAILS if the app does not answer, so a broken bundle can never
# reach the installer step.

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build React frontend
        working-directory: frontend-react
        run: |
          bun install
          bun run build
          if (-not (Test-Path dist/index.html)) { throw "React build did not produce dist/index.html" }

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install voice-clone engine (CPU torch + chatterbox-tts)
        # The voice-clone engine is bundled into the frozen app
        # (user, 2026-11-21): CPU-only torch, because the exe runs
        # on machines without an NVIDIA GPU, and chatterbox-tts
        # pins torch==2.6.0 — installing the CPU build first means
        # pip keeps it (==2.6.0 matches 2.6.0+cpu) instead of
        # downloading the ~770 MB CUDA build from PyPI.
        # Workflow-only on purpose: requirements.txt is untouched,
        # so a local run.bat never installs torch.
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts

      - name: Install motion-graphics engine (Manim + Pymunk)
        # The graphics engine is bundled into the frozen app
        # (user, 2026-11-22): in the installed .exe the Dashboard
        # "Install (free)" button can never work — sys.executable
        # is the YT-Guru.exe itself, so the in-app installer runs
        # [exe, "-m", "pip", "install", "manim", "pymunk"], which
        # just re-launches the app (new tab) instead of pip.
        # Bundling Manim here means the .exe already has the
        # engine — no install step is needed on the customer's
        # machine at all.
        # Workflow-only on purpose: requirements.txt is untouched,
        # so a local run.bat never installs manim.
        run: |
          pip install manim pymunk

      - name: Download FFmpeg (static Windows build)
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          Copy-Item ffmpeg-dl\ffmpeg-*-essentials_build\bin\ffmpeg.exe -Destination .
          Copy-Item ffmpeg-dl\ffmpeg-*-essentials_build\bin\ffprobe.exe -Destination .
          if (-not (Test-Path ffmpeg.exe) -or -not (Test-Path ffprobe.exe)) { throw "ffmpeg.exe/ffprobe.exe missing after download" }

      - name: Build frozen app with PyInstaller
        # backend/ and the React build output (frontend-react/dist,
        # bundled as "frontend") are DATA (the launcher imports
        # backend.main at runtime), so every third-party module they
        # use must be collected explicitly — PyInstaller cannot see
        # them by analysing launcher.py alone.
        run: |
          pyinstaller --onedir --windowed --name "YT-Guru" `
            --add-data "frontend-react/dist;frontend" `
            --add-data "backend;backend" `
            --collect-all fastapi `
            --collect-all starlette `
            --collect-all pydantic `
            --collect-all uvicorn `
            --collect-all yt_dlp `
            --collect-all PIL `
            --collect-all edge_tts `
            --collect-all gtts `
            --collect-all googleapiclient `
            --collect-all google_auth_oauthlib `
            --collect-all multipart `
            --collect-all websockets `
            --collect-all wsproto `
            --collect-all certifi `
            --collect-all brotli `
            --collect-all mutagen `
            --collect-all pycryptodomex `
            --collect-all urllib3 `
            --collect-all requests `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all chatterbox `
            --collect-all torch `
            --collect-all torchaudio `
            --collect-all transformers `
            --collect-all diffusers `
            --collect-all librosa `
            --collect-all conformer `
            --collect-all s3tokenizer `
            --collect-all perth `
            --collect-all numpy `
            --collect-all safetensors `
            --collect-all scipy `
            --collect-all sklearn `
            --collect-all numba `
            --collect-all soundfile `
            --collect-all joblib `
            --collect-all soxr `
            --collect-all audioread `
            --collect-all pooch `
            --collect-all lazy_loader `
            --collect-all msgpack `
            --collect-all decorator `
            --collect-all tqdm `
            --collect-all yaml `
            --collect-all regex `
            --collect-all filelock `
            --collect-all fsspec `
            --collect-all packaging `
            --collect-all typing_extensions `
            --collect-all pkuseg `
            --collect-all pykakasi `
            --collect-all manim `
            --collect-all playwright `
            --collect-all greenlet `
            --collect-all pymunk `
            --collect-all manimpango `
            --collect-all cairo `
            --collect-all moderngl `
            --collect-all moderngl_window `
            --collect-all networkx `
            --collect-all click `
            --collect-all cloup `
            --collect-all rich `
            --collect-all pyglet `
            --collect-all glm `
            --collect-all svgelements `
            --collect-all screeninfo `
            --collect-all pathops `
            --collect-all isosurfaces `
            --collect-all mapbox_earcut `
            --collect-all srt `
            --collect-all pydub `
            --collect-all watchdog `
            --hidden-import google.auth `
            --hidden-import google.auth.transport.requests `
            --hidden-import google.oauth2.credentials `
            ytguru-commercial/installer/launcher.py
          Copy-Item ffmpeg.exe -Destination dist\YT-Guru\
          Copy-Item ffprobe.exe -Destination dist\YT-Guru\
          Copy-Item ytguru-commercial\installer\Run-Setup.bat -Destination dist\YT-Guru\
          if (-not (Test-Path dist\YT-Guru\YT-Guru.exe)) { throw "PyInstaller did not produce dist\YT-Guru\YT-Guru.exe" }

      - name: Smoke test the frozen app
        run: |
          $proc = Start-Process -FilePath "dist\YT-Guru\YT-Guru.exe" -WorkingDirectory "dist\YT-Guru" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
              if ($proc.HasExited) { break }
            }
            if ($proc.HasExited) { throw "Frozen app exited during smoke test (exit code $($proc.ExitCode)). Check launcher-error.log." }
            if (-not $ok) { throw "Frozen app did not answer /api/health within 120s." }
            Write-Host "Smoke test passed: /api/health answered 200."
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 10
            if ($page.Content -notmatch "YT Guru") { throw "Home page did not serve the React app." }
            Write-Host "Smoke test passed: home page serves the React app."
            # Voice-clone engine check (bundled since 1.0.5): the
            # first /status call triggers the cold torch import,
            # which can take tens of seconds in the frozen app, so
            # the timeout is generous on purpose.
            $vc = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/voiceclone/status" -UseBasicParsing -TimeoutSec 180
            $vcObj = $vc.Content | ConvertFrom-Json
            if (-not $vcObj.installed) { throw "Voice-clone engine did not import in the frozen app: $($vc.Content)" }
            Write-Host "Smoke test passed: voice-clone engine imports in the frozen app."
            # Motion-graphics engine check (bundled since 1.0.6):
            # the Dashboard install button can never work in the
            # frozen exe, so Manim + Pymunk are bundled at build
            # time — fail the build if they are not in the bundle.
            # The first call can trigger a cold manim import, so
            # the timeout is generous on purpose.
            $gfx = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/animator/graphics/status" -UseBasicParsing -TimeoutSec 180
            $gfxObj = $gfx.Content | ConvertFrom-Json
            if (-not $gfxObj.installed) { throw "Motion-graphics engine not in the frozen app: $($gfx.Content)" }
            Write-Host "Smoke test passed: motion-graphics engine (Manim + Pymunk) present in the frozen app."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Install Inno Setup and compile the installer
        run: |
          choco install innosetup -y
          iscc /DMyAppVersion="${{ inputs.version }}" /DAppSrc="${{ github.workspace }}" ytguru-commercial/installer/ytguru.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Guru-Setup-${{ inputs.version }}
          path: ytguru-commercial/installer/installer-output/YT-Guru-Setup-*.exe

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "ytguru-commercial/installer/installer-output/YT-Guru-Setup-${{ inputs.version }}.exe" --title "YT Guru ${{ inputs.version }}" --notes "Free for everyone — no license key needed. Install the setup and all tools work, including Voice Cloner (its ~3 GB model downloads the first time you use it)."
