# YT Guru — build the Windows installer (1.0.8+), started by hand.
#
# The same steps as a local build:
#   make_lock.py  writes backend/parts_lock.json (what Setup and the app may download)
#   build.py      stages the app with an embeddable Python, checks that nothing personal is
#                 in it, and compiles ytguru-commercial/installer/ytguru.iss
#
# The setup file is small: Python packages, FFmpeg and Deno are downloaded during
# installation; speech recogniser, Manim, lip-sync, cloned voice and the small browser are
# downloaded by the app when a tool first needs them.
#
# A public GitHub Release is made ONLY when "publish" is ticked.

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.8)"
        required: true
        default: "1.0.8"
      publish:
        description: "Publish as a public GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build React frontend
        working-directory: frontend-react
        run: |
          bun install
          bun run build -- --outDir "${{ runner.temp }}/work/page" --emptyOutDir
          if (-not (Test-Path "${{ runner.temp }}/work/page/index.html")) { throw "The page was not built" }

      - name: Embeddable Python and pip
        run: |
          $dl = New-Item -ItemType Directory -Force "${{ runner.temp }}/work/dl"
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile "$dl/python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest "https://bootstrap.pypa.io/pip/pip.pyz" -OutFile "$dl/pip.pyz"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Lock the downloads
        run: |
          python -m pip install --upgrade pip setuptools wheel pillow
          python ytguru-commercial/installer/make_lock.py --work "${{ runner.temp }}/work"

      - name: Build the setup file
        run: python ytguru-commercial/installer/build.py --work "${{ runner.temp }}/work" --version "${{ inputs.version }}" --skip-frontend

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTGuru-Setup-${{ inputs.version }}
          path: ytguru-commercial/installer/installer-output/YTGuru-Setup-*.exe

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "ytguru-commercial/installer/installer-output/YTGuru-Setup-${{ inputs.version }}.exe" --title "YT Guru ${{ inputs.version }}" --notes "Windows 10/11 64-bit. Nothing needs to be installed first; the setup downloads the essential files, and each large optional part only when you ask for it."
