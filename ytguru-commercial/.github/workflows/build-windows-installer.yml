# YT Guru — build the Windows installer (DRAFT, Phase 1).
#
# PyInstaller on Linux CANNOT build a Windows .exe, so the build
# must run on Windows. This workflow runs on a free GitHub Actions
# windows-latest runner and produces YT-Guru-Setup-<version>.exe
# as a build artifact (and as a GitHub Release asset when run from
# a tag).
#
# TODO (Phase 2, first real build):
# - Point the checkout at the real repo (amirowaisy72/
#   youtube-cover-video-tool) and confirm the workflow file lives
#   in that repo's .github/workflows/ (this draft is kept in
#   ytguru-commercial/ so Phase 1 touches nothing in the repo).
# - Pin the FFmpeg download URL + checksum (Gyan.dev essentials
#   build). The URL below is the usual pattern — verify it on the
#   first run; if Gyan.dev moves, the build fails loudly here
#   rather than shipping an installer without ffmpeg.exe.
# - Verify the PyInstaller build imports cleanly (uvicorn +
#   FastAPI + yt_dlp + PIL inside the frozen bundle) and that
#   /api/health answers before Inno Setup runs.
# - Decide the version source: manual workflow_dispatch input
#   (drafted) or git tag.

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg (static Windows build)
        # TODO: pin URL + checksum; verify before first release.
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          Copy-Item ffmpeg-dl\ffmpeg-*-essentials_build\bin\ffmpeg.exe -Destination .
          Copy-Item ffmpeg-dl\ffmpeg-*-essentials_build\bin\ffprobe.exe -Destination .

      - name: Build frozen app with PyInstaller
        run: |
          pyinstaller --onedir --windowed --name "YT-Guru" `
            --add-data "frontend;frontend" `
            --add-data "backend;backend" `
            installer/launcher.py
          Copy-Item ffmpeg.exe -Destination dist\YT-Guru\
          Copy-Item ffprobe.exe -Destination dist\YT-Guru\
          Copy-Item installer\Run-Setup.bat -Destination dist\YT-Guru\

      - name: Smoke test the frozen app
        # TODO: start dist\YT-Guru\YT-Guru.exe, wait for
        # http://127.0.0.1:8000/api/health, fail the build if it
        # does not answer. (Drafted as a manual step for now.)
        run: echo "TODO: smoke-test frozen app before packaging"

      - name: Install Inno Setup and compile the installer
        run: |
          choco install innosetup -y
          iscc /DMyAppVersion="${{ inputs.version }}" installer/ytguru.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Guru-Setup-${{ inputs.version }}
          path: installer-output/YT-Guru-Setup-*.exe
